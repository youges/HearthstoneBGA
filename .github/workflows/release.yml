name: Build Windows release

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'tests/**'
      - 'scripts/**'
      - 'pyproject.toml'
      - '.github/workflows/release.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: windows-release
  cancel-in-progress: false

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 25
    env:
      QT_QPA_PLATFORM: offscreen
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
          architecture: x64
      - name: Install build dependencies
        run: |
          python -m venv .venv
          .\.venv\Scripts\python.exe -m pip install --upgrade pip
          .\.venv\Scripts\python.exe -m pip install -e ".[dev]"
          if ($LASTEXITCODE -ne 0) { throw 'Dependency installation failed' }
      - name: Prepare font for synthetic OCR checks
        run: |
          $fontPath = Join-Path $env:RUNNER_TEMP 'NotoSansCJKsc-Regular.otf'
          Invoke-WebRequest -Uri 'https://raw.githubusercontent.com/notofonts/noto-cjk/main/Sans/OTF/SimplifiedChinese/NotoSansCJKsc-Regular.otf' -OutFile $fontPath
          "BGA_TEST_FONT=$fontPath" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Run tests
        run: |
          .\.venv\Scripts\python.exe -m pytest -q
          if ($LASTEXITCODE -ne 0) { throw 'Tests failed' }
      - name: Build Windows executable
        run: .\scripts\build.ps1
      - name: Verify executable and package release
        run: |
          .\.venv\Scripts\python.exe scripts/ci_release.py
          if ($LASTEXITCODE -ne 0) { throw 'Package checks failed' }
      - name: Publish prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = & .\.venv\Scripts\python.exe -c 'import sys;sys.path.insert(0,"src");from bga import __version__;print(__version__)'
          $tag = "v$version"
          $releaseFolder = Join-Path 'release' $tag
          gh release view $tag --repo $env:GITHUB_REPOSITORY --json id 2>$null
          if ($LASTEXITCODE -eq 0) { Write-Output 'Release already exists; existing assets were preserved.'; exit 0 }
          $assets = @((Join-Path $releaseFolder "HearthstoneBGA-$version-windows-x64.zip"), (Join-Path $releaseFolder "HearthstoneBGA-$version-source.zip"), (Join-Path $releaseFolder 'SHA256SUMS.txt'))
          gh release create $tag @assets --repo $env:GITHUB_REPOSITORY --target $env:GITHUB_SHA --title "HearthstoneBGA $version（开发测试版）" --notes-file 'docs/版本说明-0.2.0.md' --prerelease
          if ($LASTEXITCODE -ne 0) { throw 'Release upload failed' }
