[build-system]
requires = ["setuptools>=70"]
build-backend = "setuptools.build_meta"

[project]
name = "hearthstone-bga"
version = "0.2.1"
description = "Windows Battlegrounds desktop automation and calibration"
requires-python = ">=3.11"
dependencies = ["PySide6-Essentials>=6.8", "opencv-python-headless>=4.10", "numpy>=2", "mss>=10", "pillow>=11", "rapidocr==3.10.0", "onnxruntime>=1.20"]

[project.optional-dependencies]
dev = ["pytest>=8", "pyinstaller>=6"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
